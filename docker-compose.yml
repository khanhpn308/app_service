services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      # 1883 (TCP) cần lộ cho ESP32 thật kết nối từ ngoài — nhưng đã BẮT BUỘC auth
      # (allow_anonymous false + password_file). 9001 (WebSocket) chỉ frontend dùng
      # qua nginx => chỉ bind localhost.
      - "1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "netstat -tln | grep -q 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - iot-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    volumes:
      - ./src/assets/floorplans:/src/assets/floorplans:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      # Backend chỉ phục vụ nội bộ qua nginx (service "backend" trong docker network).
      # Bind localhost để không truy cập trực tiếp bỏ qua reverse proxy.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    env_file:
      - .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MQTT_ENABLED: ${MQTT_ENABLED:-true}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-iot-backend-subscriber}
      MQTT_KEEPALIVE: ${MQTT_KEEPALIVE:-60}
      MQTT_TOPICS: ${MQTT_TOPICS:-devices/+/telemetry}
      MQTT_QOS: ${MQTT_QOS:-0}
      MQTT_MAX_MESSAGES: ${MQTT_MAX_MESSAGES:-500}
      INFLUX_ENABLED: ${INFLUX_ENABLED:-true}
      INFLUX_URL: ${INFLUX_URL:-http://influxdb:8086}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-CHANGE_ME_INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG:-iot}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-iot_telemetry}
      INFLUX_MEASUREMENT: ${INFLUX_MEASUREMENT:-sensor_readings}
    networks:
      - iot-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - iot-net

networks:
  iot-net:
    external: true

volumes:
  mosquitto_data:
  mosquitto_log:
