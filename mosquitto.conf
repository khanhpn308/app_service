# MQTT qua TCP (Cho ESP32, FastAPI)
listener 1883 0.0.0.0

# MQTT qua WebSockets (Bắt buộc cho React Frontend)
listener 9001 0.0.0.0
protocol websockets

# Bảo mật: tạm CHO PHÉP kết nối ẩn danh để chạy demo cục bộ.
# CẢNH BÁO: chỉ dùng cho dev/demo. Production phải bật lại auth:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
# Tạo file passwd: docker run --rm -v "$PWD/mosquitto:/m" eclipse-mosquitto:2.0 \
#   mosquitto_passwd -b -c /m/passwd <user> <password>
allow_anonymous true

# Logging
log_dest stdout
log_type warning
log_type error
log_type notice
log_timestamp true
