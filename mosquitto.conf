# MQTT qua TCP (Cho ESP32, FastAPI)
listener 1883 0.0.0.0

# MQTT qua WebSockets (Bắt buộc cho React Frontend)
listener 9001 0.0.0.0
protocol websockets

# Bảo mật: KHÔNG cho phép kết nối ẩn danh. Mọi client (ESP32, backend, frontend)
# phải xác thực bằng username/password trong file passwd.
# Tạo file: docker run --rm -v "$PWD/mosquitto:/m" eclipse-mosquitto:2.0 \
#   mosquitto_passwd -b -c /m/passwd <user> <password>
allow_anonymous false
password_file /mosquitto/config/passwd

# Logging
log_dest stdout
log_type warning
log_type error
log_type notice
log_timestamp true
